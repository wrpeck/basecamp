<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Plan camping trips: meals, gear, activities and campsite info.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="basecamp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Basecamp</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Measures safe-area insets for the Flutter app (see
    // lib/platform/safe_insets_web.dart). Returns [top, right, bottom, left].
    window.basecampSafeInsets = function () {
      var probe = document.getElementById('safe-area-probe');
      if (!probe) {
        probe = document.createElement('div');
        probe.id = 'safe-area-probe';
        probe.style.cssText =
          'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;' +
          'pointer-events:none;' +
          'padding-top:env(safe-area-inset-top,0px);' +
          'padding-right:env(safe-area-inset-right,0px);' +
          'padding-bottom:env(safe-area-inset-bottom,0px);' +
          'padding-left:env(safe-area-inset-left,0px);';
        document.body.appendChild(probe);
      }
      var cs = getComputedStyle(probe);
      var top = parseFloat(cs.paddingTop) || 0;
      var right = parseFloat(cs.paddingRight) || 0;
      var bottom = parseFloat(cs.paddingBottom) || 0;
      var left = parseFloat(cs.paddingLeft) || 0;
      // Android web views drawn edge-to-edge usually report no insets. When
      // the page covers the whole screen, leave room for the status bar and
      // the gesture navigation handle.
      var android = /Android/i.test(navigator.userAgent);
      var fullScreen = window.innerHeight >= screen.height - 2;
      if (android && fullScreen) {
        top = Math.max(top, 32);
        bottom = Math.max(bottom, 16);
      }
      return [top, right, bottom, left];
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
